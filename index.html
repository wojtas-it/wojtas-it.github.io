<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0c">
<title>Filip Wojtasiński - Portfolio</title>
<meta name="description" content="Portfolio of Filip Wojtasiński: embedded and IoT, full-stack and mobile web, game development, and machine learning projects.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b0c'/%3E%3Crect x='14' y='4' width='4' height='9' fill='%23e2a640'/%3E%3Crect x='14' y='19' width='4' height='9' fill='%23e2a640'/%3E%3Crect x='4' y='14' width='9' height='4' fill='%23e2a640'/%3E%3Crect x='19' y='14' width='9' height='4' fill='%23e2a640'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main" data-i18n="skipLink">Skip to main content</a>

<header class="site-header">
  <div class="header-inner">
    <a class="brand mono" href="#top" data-i18n="brand">wojtas.it</a>
    <nav class="site-nav" aria-label="Primary">
      <a href="#projects" data-i18n="navProjects">Projects</a>
      <a href="#about" data-i18n="navAbout">About</a>
      <a href="#contact" data-i18n="navContact">Contact</a>
    </nav>
    <div class="lang-switch mono" id="lang-switch" role="group" data-i18n-attr-label="langSwitcherLabel" aria-label="Language">
      <button type="button" data-lang-btn="pl">PL</button>
      <button type="button" data-lang-btn="en">EN</button>
      <button type="button" data-lang-btn="de">DE</button>
    </div>
  </div>
</header>

<main id="main">

  <section id="about" class="intro-section" aria-labelledby="intro-heading">
    <div class="intro-grid">
      <div class="intro-main">
        <p class="index-label mono">00 / INTRO</p>
        <h1 id="intro-heading" data-field="heroName">Filip Wojtasiński</h1>
        <p class="hero-role mono" data-i18n="heroRole"></p>
        <p class="intro-text" data-field="intro"></p>
        <p class="about-text" data-field="about"></p>
      </div>
      <aside class="facts-panel mono" aria-label="Quick facts">
        <dl>
          <div class="facts-row">
            <dt data-i18n="factsLabelStatus"></dt>
            <dd data-i18n="factsValueStatus" class="facts-status"></dd>
          </div>
          <div class="facts-row">
            <dt data-i18n="factsLabelLocation"></dt>
            <dd data-i18n="factsValueLocation"></dd>
          </div>
          <div class="facts-row">
            <dt data-i18n="factsLabelEducation"></dt>
            <dd data-i18n="factsValueEducation"></dd>
          </div>
          <div class="facts-row">
            <dt data-i18n="factsLabelFocus"></dt>
            <dd data-i18n="factsValueFocus"></dd>
          </div>
        </dl>
      </aside>
    </div>
  </section>

  <section id="projects" class="projects-section" aria-labelledby="projects-heading">
    <div class="section-heading">
      <p class="index-label mono">01 / WORK</p>
      <h2 id="projects-heading" data-i18n="projectsHeading"></h2>
      <p class="section-sub" data-i18n="projectsSub"></p>
    </div>
    <div class="filters mono" id="filters" role="group" aria-label="Filter projects by category"></div>
    <div class="projects-grid" id="projects-grid"></div>
  </section>

  <section id="contact" class="contact-section" aria-labelledby="contact-heading">
    <div class="section-heading">
      <p class="index-label mono">02 / CONTACT</p>
      <h2 id="contact-heading" data-i18n="contactHeading"></h2>
      <p class="section-sub" data-i18n="contactSub"></p>
    </div>
    <dl class="contact-panel mono" id="contact-panel"></dl>
  </section>

</main>

<footer class="site-footer">
  <p class="mono footer-note" data-i18n="footerNote"></p>
  <p class="mono footer-copy">&copy; 2026 Filip Wojtasiński</p>
</footer>

<script src="content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
